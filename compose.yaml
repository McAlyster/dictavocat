services:
  dictavocat:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:${HOST_PORT:-8080}:8080"   # port local de l'hôte, réglable dans .env
    volumes:
      - dictavocat-data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    logging:                 # journaux limités : ils contiennent des adresses IP (RGPD)
      driver: json-file
      options:
        max-size: "1m"
        max-file: "2"

volumes:
  dictavocat-data:
